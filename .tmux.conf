# tmux config (tmux 3.4). Reload inside tmux with: prefix + r

# --- usability ---
set -g mouse on                      # scroll, click panes, drag borders to resize
set -g history-limit 50000           # more scrollback
set -g base-index 1                  # windows start at 1 (easier to reach)
setw -g pane-base-index 1
set -g renumber-windows on           # no gaps after closing a window
set -s escape-time 0                 # no delay after Esc
set -g focus-events on
set -g set-clipboard on              # copy from tmux into the Windows clipboard (OSC 52)

# --- colors ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"   # true color

# --- splits and windows open in the current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- reload config ---
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
